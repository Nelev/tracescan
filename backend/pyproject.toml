[project]
name = "tracescan"
version = "0.1.0"
description = "Multi-agent LLM failure triage"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "fastmcp>=3.4,<4",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.8",
    "uvicorn[standard]",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter wraps code; long comments and docstrings are left alone

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
