[project]
name = "tracescan"
version = "0.1.0"
description = "Multi-agent LLM failure triage"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "fastmcp>=3.4,<4",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.20",
    "uvicorn[standard]",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
