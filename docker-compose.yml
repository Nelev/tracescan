# TraceScan on Docker Compose.
#
# Postgres alone (for running the backend and frontend on this machine with uv and npm):
#   docker compose up -d
#   DATABASE_URL=postgresql://postgres:tracescan@127.0.0.1:5433/postgres
#
# The whole app (Postgres, the migration, the backend, the frontend), behind the `app` profile:
#   docker compose --profile app up -d --build
# It reads backend/.env and frontend/.env.local (see their .env.example files) and serves the UI on
# http://localhost:3010 and the API and the trace collector on http://localhost:8010, the ports
# that leave Medas its own 3000 and 8000; set FRONTEND_PORT and BACKEND_PORT to move them, and
# DB_PORT to publish Postgres somewhere other than 5433 (the containers reach it as db:5432).
#
# Every port is bound to this machine only. The password defaults to `tracescan`; to use another,
# set POSTGRES_PASSWORD in the shell or in a gitignored .env next to this file before the first
# start (Postgres reads it only when it creates the volume) and use it in DATABASE_URL too.

# What the backend and the migration share: the image, backend/.env, and the database by its name
# on the Compose network. The two URLs here replace the ones in backend/.env, which point at the
# published port on this machine for the uv workflow.
x-backend: &backend
  build:
    context: ./backend
  image: tracescan-backend
  env_file:
    - path: ./backend/.env
  environment: &backend-env
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-tracescan}@db:5432/postgres
    TRACE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-tracescan}@db:5432/postgres
  depends_on:
    db:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true

services:
  db:
    # pgvector and the Postgres major are pinned: a moving tag could change either under the data.
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracescan}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - tracescan-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The app never migrates by itself and refuses to start before the migration: this runs
  # `alembic upgrade head` once and exits; the backend starts only when it succeeded.
  migrate:
    <<: *backend
    profiles: [app]
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  backend:
    <<: *backend
    profiles: [app]
    environment:
      <<: *backend-env
      # The origins a Clerk token may be issued for: the UI's published port.
      CLERK_AUTHORIZED_PARTIES: '["http://localhost:${FRONTEND_PORT:-3010}"]'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8010}:8000"
    volumes:
      # Dry-run output (issues, regression cases) lands in backend/out as with uv.
      - ./backend/out:/app/out
      # The embedding model, downloaded on the first run and kept.
      - fastembed-cache:/cache/fastembed
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
      # The Clerk keys, for the build step only: never in a layer.
      secrets:
        - frontend_env
    image: tracescan-frontend
    profiles: [app]
    env_file:
      - path: ./frontend/.env.local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3010}:3000"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  frontend_env:
    file: ./frontend/.env.local

volumes:
  tracescan-db:
  fastembed-cache:
